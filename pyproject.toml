[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "project-brief"
version = "0.1.0"
description = "Compact project orientation for terminal workflows"
requires-python = ">=3.11"

[project.scripts]
project-brief = "project_brief.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
