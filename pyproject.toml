[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "project-brief"
version = "0.1.1"
description = "Compact project orientation for terminal workflows"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Richard Young", email = "code@richyoung.ca"}]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/richyo-codes/project-brief"
Repository = "https://github.com/richyo-codes/project-brief"
Issues = "https://github.com/richyo-codes/project-brief/issues"

[project.scripts]
project-brief = "project_brief.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = ["ruff>=0.14.0"]
